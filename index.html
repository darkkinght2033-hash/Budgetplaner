<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Budgetplaner</title>
<style>
:root{--bg:#020509;--card:#080d13;--line:#172231;--blue:#1683ff;--red:#ff3b46;--green:#39d353;--muted:#91a0b5;--white:#f5f8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:720px;margin:auto;padding:22px 18px 105px}.top{display:flex;justify-content:space-between;align-items:center;margin:10px 0 22px}.top h1{font-size:28px;color:var(--blue);margin:0}.iconbtn{border:1px solid var(--line);background:#08111c;color:var(--blue);width:46px;height:46px;border-radius:14px;font-size:23px}.summary{border:1px solid #0e67bd;border-radius:20px;padding:22px;background:linear-gradient(135deg,#07101b,#03070b);display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.label{font-size:14px;color:var(--blue);font-weight:800;text-transform:uppercase}.available{font-size:48px;font-weight:800;color:var(--blue);margin:10px 0}.muted{color:var(--muted)}.metric{padding:9px 0}.metric+.metric{border-top:1px solid var(--line)}.metric strong{display:block;font-size:28px;margin-top:5px}.income strong,.income .label{color:var(--green)}.expense strong,.expense .label{color:var(--red)}h2{font-size:16px;color:var(--blue);margin:28px 4px 12px;text-transform:uppercase}.accounts,.transactions{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card)}.row{display:flex;align-items:center;gap:14px;padding:17px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.badge{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#0b1725;color:var(--blue);font-weight:800}.row .main{flex:1;min-width:0}.row .main b{color:var(--blue);font-size:18px}.amount{font-size:20px;font-weight:800;color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px;min-height:125px;text-align:left;color:var(--white)}.tile span{display:block;font-weight:800;color:var(--blue);margin:10px 0 6px}.tile.red span{color:var(--red)}.tile.green span{color:var(--green)}.txamount{font-weight:800;font-size:18px}.txamount.red{color:var(--red)}.txamount.green{color:var(--green)}.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(720px,100%);background:rgba(2,5,9,.96);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center}.nav{background:none;border:0;color:var(--muted);font-size:12px}.nav.active{color:var(--blue)}.plus{width:64px;height:64px;border-radius:50%;border:1px solid #45a2ff;background:var(--blue);color:white;font-size:38px;margin:-28px auto 0}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:20px;z-index:5}.modal.open{display:grid}.sheet{width:min(520px,100%);background:#080d13;border:1px solid var(--line);border-radius:20px;padding:20px}.sheet h3{margin-top:0;color:var(--blue)}input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#03070b;color:white;margin:6px 0 12px;font-size:16px}.actions{display:flex;gap:10px}.primary,.secondary{flex:1;padding:13px;border-radius:12px;border:0;font-weight:800}.primary{background:var(--blue);color:white}.secondary{background:#151c25;color:white}@media(max-width:560px){.summary{grid-template-columns:1fr}.available{font-size:42px}.grid{grid-template-columns:1fr 1fr}.tile{min-height:115px}}@media(max-width:350px){.grid{grid-template-columns:1fr}.top h1{font-size:23px}}
</style>
</head><body>
<div class="app">
<div class="top"><button class="iconbtn">☰</button><h1>AUGUST 2026⌄</h1><button class="iconbtn">⚙</button></div>
<section class="summary"><div><div class="label">Verfügbar</div><div class="available" id="available">683,00 €</div><div class="muted">von <span id="incomeSub">2.100,00 €</span> Einnahmen</div></div><div><div class="metric income"><div class="label">Einnahmen</div><strong id="income">2.100,00 €</strong></div><div class="metric expense"><div class="label">Ausgaben</div><strong id="expenses">1.417,00 €</strong></div></div></section>
<h2>Konten</h2><section class="accounts"><div class="row"><div class="badge">S</div><div class="main"><b>Sparkasse</b><div class="muted">Fixkosten diesen Monat</div></div><div class="amount">1.074,00 €</div></div><div class="row"><div class="badge">TR</div><div class="main"><b>Trade Republic</b><div class="muted">Fixkosten diesen Monat</div></div><div class="amount">541,00 €</div></div></section>
<h2>Kategorien</h2><section class="grid"><button class="tile red" data-add="expense">▣<span>Ausgaben</span><small>Ausgaben erfassen und verwalten</small></button><button class="tile">▤<span>Fixkosten</span><small>Wiederkehrende Kosten verwalten</small></button><button class="tile green" data-add="income">↑<span>Einnahmen</span><small>Einnahmen erfassen und verwalten</small></button><button class="tile">◔<span>Statistik</span><small>Auswertungen und Übersichten</small></button><button class="tile">◎<span>Budgets</span><small>Monatsbudgets verwalten</small></button><button class="tile">•••<span>Mehr</span><small>Weitere Optionen und Einstellungen</small></button></section>
<h2>Letzte Buchungen</h2><section class="transactions" id="transactions"></section>
</div>
<nav class="bottom"><button class="nav active">⌂<br>Übersicht</button><button class="nav">▣<br>Ausgaben</button><button class="plus" id="plus">+</button><button class="nav">▤<br>Fixkosten</button><button class="nav">▥<br>Statistik</button></nav>
<div class="modal" id="modal"><form class="sheet" id="form"><h3>Neue Buchung</h3><label>Typ<select id="type"><option value="expense">Ausgabe</option><option value="income">Einnahme</option></select></label><label>Bezeichnung<input id="name" required placeholder="z. B. Einkauf Netto"></label><label>Betrag in €<input id="amount" required type="number" min="0.01" step="0.01" inputmode="decimal"></label><label>Konto<select id="account"><option>Sparkasse</option><option>Trade Republic</option></select></label><div class="actions"><button type="button" class="secondary" id="cancel">Abbrechen</button><button class="primary">Speichern</button></div></form></div>
<script>
const seed=[{name:'Einkauf Netto',amount:34.67,type:'expense',account:'Trade Republic',date:'22.08.2026'},{name:'Tanken',amount:50,type:'expense',account:'Trade Republic',date:'21.08.2026'},{name:'Fitnessstudio',amount:50,type:'expense',account:'Trade Republic',date:'20.08.2026'},{name:'Gehalt August',amount:2100,type:'income',account:'Sparkasse',date:'01.08.2026'}];
let tx=JSON.parse(localStorage.getItem('budgetTx')||'null')||seed;const euro=n=>n.toLocaleString('de-DE',{style:'currency',currency:'EUR'});function render(){const inc=tx.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0);const exp=1417+tx.slice(seed.length).filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0)-tx.slice(seed.length).filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0);document.querySelector('#income').textContent=euro(inc);document.querySelector('#incomeSub').textContent=euro(inc);document.querySelector('#expenses').textContent=euro(exp);document.querySelector('#available').textContent=euro(inc-exp);document.querySelector('#transactions').innerHTML=tx.slice().reverse().slice(0,7).map(x=>`<div class="row"><div class="badge">${x.type==='income'?'↑':'↓'}</div><div class="main"><b style="color:var(--white)">${x.name}</b><div class="muted">${x.date} • ${x.account}</div></div><div class="txamount ${x.type==='income'?'green':'red'}">${x.type==='income'?'+':'-'} ${euro(x.amount)}</div></div>`).join('');localStorage.setItem('budgetTx',JSON.stringify(tx))}render();
const modal=document.querySelector('#modal'),type=document.querySelector('#type');function open(t){type.value=t||'expense';modal.classList.add('open');document.querySelector('#name').focus()}document.querySelector('#plus').addEventListener('click',()=>open());document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>open(b.dataset.add)));document.querySelector('#cancel').addEventListener('click',()=>modal.classList.remove('open'));document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();const a=Number(document.querySelector('#amount').value);if(!a||a<=0)return;tx.push({name:document.querySelector('#name').value.trim(),amount:a,type:type.value,account:document.querySelector('#account').value,date:new Date().toLocaleDateString('de-DE')});e.target.reset();modal.classList.remove('open');render()});
</script></body></html>
